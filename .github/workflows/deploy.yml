name: Deploy Docs

on:
  push:
    branches:
      - zh-docs
    paths:
      - docs/**
      - automd.config.ts
      - package.json
      - eslint.config.mjs
      - .github/workflows/deploy.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy Docs
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm run docs:build

      - name: Checkout gh-pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Deploy to gh-pages
        run: |
          # Create the branch locally if it doesn't exist on the remote yet
          if [ ! -d gh-pages/.git ]; then
            mkdir -p gh-pages
            cd gh-pages
            git init
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            git checkout -b gh-pages
            cd ..
          fi

          cd gh-pages

          # Clean old files (preserve .git)
          find . -maxdepth 1 -not -name '.git' -not -name '.' -exec rm -rf {} +

          # Copy new build
          cp -a ../docs/.vitepress/dist/. .

          # Copy English homepage to /en/ and fix hardcoded absolute links
          # (VitePress rewrites handle /en/guide/ etc. but frontmatter links are literal)
          cp index.html en/index.html
          sed -i \
            -e 's|href="/guide/|href="/en/guide/|g' \
            -e 's|href="/cli/|href="/en/cli/|g' \
            -e 's|href="/reference/|href="/en/reference/|g' \
            -e 's|href="/ecosystem/|href="/en/ecosystem/|g' \
            -e 's|href="/playground|href="/en/playground|g' \
            en/index.html

          # Use Chinese homepage as the default root page
          cp zh/index.html index.html

          touch .nojekyll
          echo "toonformat.cn" > CNAME

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Deploy site from ${{ github.repository }}@${{ github.sha }}"
            git push origin HEAD:gh-pages
          else
            echo "No changes to deploy"
          fi
